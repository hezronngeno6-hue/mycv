<div style="color:red">
<form id="contactForm">
    <label for="c-name">Enter your Name:</label><br>
    <input type="text" id="c-name" name="Name" required><br>
    <label for="c-email">E-mail address*</label><br>
    <input type="email" id="c-email" name="Email" required><br>
    <label for="c-subject">Message Subject:</label><br>
    <input type="text" id="c-subject" name="Subject"><br>
    <label for="c-message">Your Message:</label><br>
    <textarea id="c-message" name="Message" rows="5" cols="40"></textarea><br>
    <input type="checkbox" id="c-copy" name="Copy">
    <label for="c-copy">E-mail a copy of this message to your own address</label><br><br>
    <button type="submit" style="color: green;">Send</button>
</form>
<p id="formStatus" style="color: darkgreen; font-weight: bold;"></p>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function (event) {
    event.preventDefault();

    var name = document.getElementById('c-name').value.trim();
    var email = document.getElementById('c-email').value.trim();
    var subject = document.getElementById('c-subject').value.trim();
    var message = document.getElementById('c-message').value.trim();
    var sendCopy = document.getElementById('c-copy').checked;

    var body = 'Name: ' + name + '\n'
             + 'Email: ' + email + '\n\n'
             + 'Message:\n' + message + '\n';

    var link = 'mailto:hezronngeno6@gmail.com'
             + '?subject=' + encodeURIComponent(subject || 'Website message from ' + name)
             + '&body=' + encodeURIComponent(body);

    if (sendCopy && email) {
        link += '&cc=' + encodeURIComponent(email);
    }

    window.location.href = link;
    document.getElementById('formStatus').textContent =
        'Opening your email app... if nothing happens, email hezronngeno6@gmail.com directly.';
});
</script>
